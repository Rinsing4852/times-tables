name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run generate:creatures
        working-directory: frontend
      - run: git diff --exit-code -- public/assets/creatures
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up -d --build
      - run: |
          for attempt in {1..30}; do
            curl --fail http://127.0.0.1:3000 && exit 0
            sleep 2
          done
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose down --volumes

  release-metadata:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, containers, browser]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: jq -r '"value=" + .version' frontend/package.json >> "$GITHUB_OUTPUT"

  publish:
    needs: release-metadata
    if: needs.release-metadata.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [backend, frontend]
    uses: docker/github-builder/.github/workflows/build.yml@v1
    with:
      context: ./${{ matrix.service }}
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: ${{ matrix.service }}
      meta-images: ghcr.io/rinsing4852/recall-forge-${{ matrix.service }}
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ needs.release-metadata.outputs.version }}
        type=sha,prefix=sha-
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
