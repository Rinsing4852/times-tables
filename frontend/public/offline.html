<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Recall Forge is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f6f8fb; color: #18212f; font: 18px/1.5 Arial, sans-serif; }
      main { width: min(520px, 100%); background: white; border: 2px solid #d9e1ea; border-radius: 8px; padding: 28px; }
      h1 { font-size: 2rem; margin-top: 0; }
      button { min-height: 52px; border: 0; border-radius: 8px; padding: 0 20px; background: #2563eb; color: white; font: inherit; font-weight: 800; }
      button:focus-visible { outline: 4px solid #f2d133; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Recall Forge is resting</h1>
      <p>Reconnect to the home server on your LAN or Tailscale network, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
